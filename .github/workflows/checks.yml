name: checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline-checks:
    runs-on: ubuntu-24.04
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python tools/selftest.py
      - run: python -m unittest tools.test_regressions -v
