name: checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  plasmic-ec-2:
    name: Plasmic EC 2.0.0 tests on Linux (simulators and simulated devices only)
    runs-on: ubuntu-24.04
    env:
      PLASMIC_NO_SERIAL: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Write the installer's site file with its built-in defaults (the real one is not committed)
        run: |
          python -c "import json, pathlib; pathlib.Path('installer/site.json').write_text(json.dumps({'rpi_host': '192.168.1.1', 'rpi_user': 'pi'}, indent=2) + '\n', encoding='utf-8')"
      - name: Vendored v7 backend and fonts match their manifest
        run: python -B docs/tools/check_v7_sync.py
      - name: Field-verified files are unchanged (the four uncommitted binaries are reported as missing)
        run: python -B docs/tools/check_sums.py || true
      - name: Unit and integration tests
        # Several files time real threads against simulated devices; on a shared 2-vCPU runner a step can
        # occasionally land on the wrong side of a deadline, so a failing file is run a second time.
        # A file that fails twice fails the job.
        run: |
          set -e
          for t in recipe store rpilink analysis calibration measurements analyst pumpboard megasim pump_guard \
                   port_safety interlock manual runner flow api_pin web_static vendor; do
            echo "::group::tests/test_$t.py"
            python -B tests/test_$t.py || { echo "::warning::tests/test_$t.py failed once; running it again"; python -B tests/test_$t.py; }
            echo "::endgroup::"
          done
      - name: Installer and Nano flasher (the checks of the bundled third-party binaries fail in a clean checkout)
        run: |
          python -B tests/test_installer.py 2>&1 | tail -n 3 || true
          python -B tests/test_flash_nano.py 2>&1 | tail -n 3 || true
  station-suite-windows:
    # The station runs Windows with the bundled Python 3.12. These three files use Windows port semantics
    # and millisecond timing (test_measure walks a simulated RS485 bus at 9600 baud), so they are run here on
    # a Windows runner as information only; the authoritative run is on the station itself.
    name: Station-only test files on Windows (informational)
    runs-on: windows-latest
    continue-on-error: true
    env:
      PLASMIC_NO_SERIAL: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Write the installer's site file with its built-in defaults (the real one is not committed)
        run: |
          python -c "import json, pathlib; pathlib.Path('installer/site.json').write_text(json.dumps({'rpi_host': '192.168.1.1', 'rpi_user': 'pi'}, indent=2) + '\n', encoding='utf-8')"
      - name: tests/test_app.py
        run: python -B tests/test_app.py
      - name: tests/test_tcpd.py
        if: always()
        run: python -B tests/test_tcpd.py
      - name: tests/test_measure.py
        if: always()
        run: python -B tests/test_measure.py
  legacy-v6:
    name: legacy/autonomous-laboratory-v6 self-test
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: legacy/autonomous-laboratory-v6
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python tools/selftest.py
      - run: python -m unittest tools.test_regressions -v
